
[project]
name = "sistema-biblioteca"
version = "0.1.0"
description = "Sistema de aluguel de livros para uma biblioteca"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "typos",
    "httpx",
    "poethepoet",
]

[tool.ruff]
line-length = 79
extend-exclude = ["migrations"]

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]

[tool.ruff.format]
preview = true
quote-style = "single"

[tool.pytest]
pythonpath = ["."]
addopts = ["-p", "no:warnings", "--cov=app", "--cov-context=test"]
testpaths = ["teste"]

[tool.poe.tasks]

lint.sequence = [
    { cmd = "typos" },
    { cmd = "ruff check" },
]

format.sequence = [
    { cmd = "ruff check --fix" },
    { cmd = "ruff format" },
]

serve = "fastapi dev app.py"

test.sequence = [
    "lint",
    { cmd = "pytest -s -x -vv $POE_EXTRA_ARGS" },
    { cmd = "coverage html --show-contexts" },
]

[tool.typos.files]
extend-exclude = ["*.md"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
